<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactive Page Layout</title>
    <!-- without base.css, all formating is broken -->
    <link rel="stylesheet" href="css/base.css" />

    <link rel="stylesheet" href="css/style-base.css" />
    <link rel="stylesheet" href="css/style-base-tr.css" />
    <link rel="stylesheet" href="css/progressbar-base.css" />
    <link rel="stylesheet" href="css/arrow.css" />
    <link rel="icon" type="image/x-icon" href="imaages/favicon.svg" />
    <script src="js/axios.min.js"></script>
</head>
<body>
    <header>
        <h1>Big Title</h1>
        <p>Version #1.0</p>
    </header>
    
    <div id="left-panel">
        <ul id="dynamic-list">
            <!-- Dynamic list items will be added here -->
        </ul>
    </div>
    
    <div id="center-panel">
        <!-- Static content for center panel -->
        <h2>Center Panel Content</h2>
        <p>This content will be refreshed when a left rectangle is clicked.</p>
    </div>
    
    <div id="right-panel">
        <table id="time-selection">
            <!-- Static time selection table -->
            <tr><td>00:00</td><td>01:00</td><td>02:00</td></tr>
            <tr><td>03:00</td><td>04:00</td><td>05:00</td></tr>
            <!-- Add more rows as needed -->
        </table>
    </div>
    
    <footer id="message-area">
        <!-- Messages or errors will be displayed here -->
    </footer>
    
    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <h2>Confirmation</h2>
            <p>Are you sure you want to proceed?</p>
            <button onclick="confirmAction()">Yes</button>
            <button onclick="closeModal()">No</button>
        </div>
    </div>

    <script>
        // Function to add items to the left panel
        function addLeftPanelItem(text) {
            const list = document.getElementById('dynamic-list');
            const item = document.createElement('li');
            item.textContent = text;
            item.onclick = function() {
                updateCenterPanel(text);
            };
            list.appendChild(item);
        }

        // Function to update the center panel
        function updateCenterPanel(text) {
            const centerPanel = document.getElementById('center-panel');
            centerPanel.innerHTML = `<h2>${text}</h2><p>Content updated based on selection.</p>`;
        }

        // Function to show the modal
        function showModal() {
            document.getElementById('confirmation-modal').style.display = 'block';
        }

        // Function to close the modal
        function closeModal() {
            document.getElementById('confirmation-modal').style.display = 'none';
        }

        // Function to confirm action (placeholder)
        function confirmAction() {
            closeModal();
            // Add your confirmation logic here
        }

        // Function to display messages in the footer
        function displayMessage(message) {
            document.getElementById('message-area').textContent = message;
        }

        // Example usage
        addLeftPanelItem('Item 1');
        addLeftPanelItem('Item 2');
        addLeftPanelItem('Item 3');
        displayMessage('Welcome to the application!');
    </script>
</body>
</html>
